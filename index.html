<style>
/* Layout: sidebar executiva fixa + área de trabalho com barra de filtros globais fixa no topo; grid de 12 colunas para cartões e gráficos. */
:root{
  --bg:#f5f3f1; --surface:#ffffff; --surface-2:#faf8f6; --sidebar:#ffffff;
  --ink:#1c1514; --ink-2:#5a504d; --muted:#8a807c; --line:#ebe5e1; --line-2:#d9d1cc;
  --brand:#d4191f; --brand-2:#ef7d10; --brand-soft:#fdecea; --brand-ink:#b3141a;
  --prior:#bdb4b0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s-other:#a8a09c;
  --good:#0ca30c; --good-ink:#006300; --good-soft:#e7f5e7;
  --warn:#fab219; --warn-ink:#8a5a00; --warn-soft:#fdf3dc;
  --crit:#d03b3b; --crit-ink:#a32323; --crit-soft:#fbe8e8;
  --shadow:0 1px 2px rgba(28,21,20,.05),0 4px 16px rgba(28,21,20,.04);
  --logo-blend:multiply;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110e0e; --surface:#1b1716; --surface-2:#221d1c; --sidebar:#0c0a0a;
  --ink:#f6f1ef; --ink-2:#c8bdb9; --muted:#8f8480; --line:#2d2726; --line-2:#3d3533;
  --brand:#ef3b40; --brand-2:#ff8e2b; --brand-soft:#3a1617; --brand-ink:#ff6a6e;
  --prior:#5d5452;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#6d6461;
  --good:#0ca30c; --good-ink:#3ccb3c; --good-soft:#132a13;
  --warn:#fab219; --warn-ink:#fac35a; --warn-soft:#33270c;
  --crit:#d03b3b; --crit-ink:#ff7b7b; --crit-soft:#3a1515;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --logo-blend:lighten; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#110e0e; --surface:#1b1716; --surface-2:#221d1c; --sidebar:#0c0a0a;
  --ink:#f6f1ef; --ink-2:#c8bdb9; --muted:#8f8480; --line:#2d2726; --line-2:#3d3533;
  --brand:#ef3b40; --brand-2:#ff8e2b; --brand-soft:#3a1617; --brand-ink:#ff6a6e;
  --prior:#5d5452;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#6d6461;
  --good:#0ca30c; --good-ink:#3ccb3c; --good-soft:#132a13;
  --warn:#fab219; --warn-ink:#fac35a; --warn-soft:#33270c;
  --crit:#d03b3b; --crit-ink:#ff7b7b; --crit-soft:#3a1515;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --logo-blend:lighten; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* Sidebar */
.side{background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;z-index:30}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 6px}
.brand img{width:132px;height:auto;mix-blend-mode:var(--logo-blend)}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:650}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px;font-size:12px;color:var(--muted)}
.temp{display:flex;gap:6px;flex-wrap:wrap}
.temp span{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2)}

/* Main + filtros */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.topbar .menu-btn{display:none}
.title-wrap{min-width:0;flex:1 1 180px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink);font-weight:700}
h1{font-family:var(--f-display);font-weight:750;font-size:22px;letter-spacing:-.01em;margin:2px 0 0;text-wrap:balance}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
select,input[type=date]{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;height:34px;min-width:0}
input[type=date]{width:134px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface);height:34px}
.seg button{border:0;background:transparent;padding:0 11px;cursor:pointer;color:var(--ink-2);font-weight:550;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;white-space:nowrap;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.actions{display:flex;gap:8px;align-items:flex-end;position:relative}
.stack{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.stack .btn{height:30px;font-size:12.5px;padding:0 10px;justify-content:flex-start}
.actions.stack .menu{top:70px}
.menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:40;display:flex;flex-direction:column}
.menu button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.menu button:hover{background:var(--surface-2)}
.menu button small{color:var(--muted);font-size:12px}
.menu button:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:550;z-index:60;max-width:calc(100% - 32px)}

.content{padding:22px 28px 40px;display:flex;flex-direction:column;gap:18px}
.context{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--ink-2);font-size:13px}
.context b{color:var(--ink);font-weight:650}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.kpi .val{font-family:var(--f-display);font-weight:750;font-size:24px;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.hero{border-top:3px solid var(--brand)}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:2px 7px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.up{background:var(--good-soft);color:var(--good-ink)}
.delta.down{background:var(--crit-soft);color:var(--crit-ink)}
.delta.flat{background:var(--surface-2);color:var(--ink-2)}
.spark{width:84px;height:28px;flex:none}

/* Grid de cartões */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.cdt.cdtot{border-top:3px solid var(--brand)}
.rvm{--rv-c:#12658f;--rv-b:#a8243f;--rv-s:#1f7a52;--rv-tot:#EEEEEE;--rv-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace}
:root[data-theme="dark"] .rvm{--rv-c:#5ab0e0;--rv-b:#ff3b3b;--rv-s:#4fc48c;--rv-tot:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rvm{--rv-c:#5ab0e0;--rv-b:#ff3b3b;--rv-s:#4fc48c;--rv-tot:transparent}}
.rvm .kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.rvk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.rvk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rv-c)}.rvk.b:before{background:var(--rv-b)}.rvk.s:before{background:var(--rv-s)}
.rvk .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rvk .v{font-family:var(--rv-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.02em;color:var(--ink)}
.rvk .s2{font-size:11.5px;color:var(--muted);margin-top:2px}
.rvc{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.rvc .hd{padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rvc .hd img{height:22px;width:auto;max-width:110px;object-fit:contain}
.rvc .hd h2{margin:0;font-size:18px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.rvc .hd p{margin:0 0 0 auto;font-size:12px;color:var(--muted)}.rvc .hd .fld select{height:32px}
.rvc .tw{padding:0 6px 0}
.rvc table{width:100%;border-collapse:collapse;font-size:12px;min-width:960px}
.rvc th,.rvc td{padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.rvc .rvmain th:nth-child(2),.rvc .rvmain td:nth-child(2),.rvc .hist th:first-child,.rvc .hist td:first-child{text-align:left}
.rvc thead th{background:var(--surface-2);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:700;border-bottom:2px solid var(--line)}
.rvc thead th.g{text-align:center;color:#fff;font-size:10.5px}.rvc .g-c{background:var(--rv-c)}.rvc .g-b{background:var(--rv-b)}.rvc .g-s{background:var(--rv-s)}
:root[data-theme="dark"] .rvc thead th.g{color:#08151d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rvc thead th.g{color:#08151d}}
.rvc td.n{font-family:var(--rv-mono);font-variant-numeric:tabular-nums}
.rvc tbody tr{height:38px}.rvc tr.tot{background:var(--rv-tot);font-weight:700}.rvc tr.tot td{border-top:2px solid var(--line)}
.rvc .gap,.rvc th.gap{width:6px;padding:0;border:0;background:transparent}
.rvc .tw:has(.rvmain){padding:0}.rvc .rvmain td:first-child,.rvc .rvmain th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);width:6px;min-width:6px}
.rvc .rvmain td:nth-child(2),.rvc .rvmain thead tr:nth-child(2) th:nth-child(2),.rvc .rvmain thead tr:first-child th:nth-child(2){position:sticky;left:6px;z-index:2;background:var(--surface);box-shadow:6px 0 6px -6px rgba(0,0,0,.25)}
.rvc .rvmain thead th:nth-child(2){background:var(--surface-2)}.rvc .rvmain tr.tot td:nth-child(2),.rvc .rvmain tr.tot td:first-child{background:linear-gradient(var(--rv-tot),var(--rv-tot)),var(--surface)}

.rvk .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.rvk .v{font-size:18px}.rvk{padding:12px}}
@media (max-width:560px){html:not(.pdfmode) .rvm .kpis{grid-template-columns:1fr 1fr;grid-auto-flow:row}html:not(.pdfmode) .rvm .kpis>.rvk:nth-child(1){grid-column:1;grid-row:1}html:not(.pdfmode) .rvm .kpis>.rvk:nth-child(2){grid-column:1;grid-row:2}html:not(.pdfmode) .rvm .kpis>.rvk:nth-child(3){grid-column:1;grid-row:3}html:not(.pdfmode) .rvm .kpis>.rvk:nth-child(5){grid-column:2;grid-row:1}html:not(.pdfmode) .rvm .kpis>.rvk:nth-child(4){grid-column:2;grid-row:2}}
.cdt4{padding:14px 9px;align-self:stretch}.cdt4 table{font-size:11.5px}.cdt4 th,.cdt4 td{padding:6px 1px}.cdt4 td.pctT,.cdt4 th:nth-child(3){padding-left:5px}.cdt4 th{font-size:10px;letter-spacing:.03em}
.cdt4 td.grp,.cdt4 td.sub2{white-space:normal;line-height:1.25}.cdt4 td.sub2{padding-left:8px}.cdt4 td:nth-child(n+2),.cdt4 th:nth-child(n+2){white-space:nowrap}
.cdt4 table{table-layout:fixed;width:100%}.cdt4 th:nth-child(1){width:38%}.cdt4 th:nth-child(2){width:42%}.cdt4 th:nth-child(3){width:20%}.cdt4 td.sub2{padding-left:5px}.cdt td.pctT{color:var(--ink-2);font-variant-numeric:tabular-nums}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0;letter-spacing:-.005em}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.why{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin:0}
.why b{color:var(--ink-2);font-weight:600}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.chart-box{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}

/* Tabelas */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--surface-2)}
td.rk{color:var(--muted);width:28px}
td.tot{font-weight:700;background:var(--surface-2)}
td.grp{font-weight:650;color:var(--ink)}

.cdt table{font-size:12.5px}.cdt th,.cdt td{padding:7px 4px}.cdt td.sub2{padding-left:12px}.cdt .delta{font-size:11px;padding:1px 5px}
.sec-h{margin:22px 0 10px}.sec-h h2{font-size:15px;margin:0}.sec-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
td.mix{color:var(--ink-2);white-space:nowrap}
td.sub2{color:var(--ink-2);padding-left:22px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell span.b{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--brand);opacity:.85}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 10px;border-radius:8px;background:var(--surface-2);align-items:start}
.alert svg{width:18px;height:18px;margin-top:1px}
.alert b{display:block;font-size:13px;font-weight:650}
.alert span{font-size:12.5px;color:var(--ink-2)}
.alert .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.alert.crit .tag{color:var(--crit-ink)} .alert.warn .tag{color:var(--warn-ink)} .alert.good .tag{color:var(--good-ink)} .alert.info .tag{color:var(--ink-2)}
.alert.crit svg{color:var(--crit)} .alert.warn svg{color:var(--warn)} .alert.good svg{color:var(--good)} .alert.info svg{color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini div{padding:10px 12px;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.mini small{font-size:11.5px;color:var(--ink-2);font-weight:550}
.mini strong{font-family:var(--f-display);font-size:18px;font-weight:700}
.mini em{font-style:normal;font-size:11.5px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px}
.note b{color:var(--ink)}
.gauge{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.gauge span{display:block;height:100%;background:var(--brand);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.clkr{cursor:pointer}.clkr:hover td{background:var(--surface-2)}.clkr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.chip.hint{color:var(--brand);border-color:var(--brand)}
.kpi.clk{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi.clk:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}

/* efetividade: meses e referência 2025 */
function insEf(k,f,R){

  else{const base=k==='dp'?a.vp:a.vp;out.push({h:'Peso sobre as vendas',items:[{k:'',t:`${F.n(a[k])} pedidos equivalem a ${F.pct(div(a[k],base),2)} dos ${F.n(base)} pedidos vendidos.`},{k:'',t:k==='dp'?`Em KG: ${F.n(a.dk)} kg devolvidos (${F.pct(div(a.dk,a.vk),2)} do vendido).`:`Em KG: ${F.n(a.rk)} kg reembarcados (${F.pct(div(a.rk,a.vk),2)} do vendido).`}]})}
  const L=ms.map(m=>({l:mLbl(m.k),v:efAgg([m])[k]}));const e=extremes(L);
  if(e){const best=isPct?e.hi:e.lo,worst=isPct?e.lo:e.hi;const its=[{k:'good',t:`Melhor mês: <b>${best.l}</b> (${f(best.v)}).`},{k:'crit',t:`Pior mês: <b>${worst.l}</b> (${f(worst.v)}).`}];
    if(L.length>=2){const c=chg(L[L.length-1].v,L[L.length-2].v,o);if(c)its.push({k:tone(c.v,o),t:`${L[L.length-1].l} contra ${L[L.length-2].l}: ${c.t}.`})}
    if(isPct){const below=L.filter(x=>x.v<B[k]);its.push({k:below.length?'crit':'good',t:below.length?`${below.length} de ${L.length} meses abaixo do total de 2025: ${below.map(x=>x.l).join(', ')}.`:`Todos os ${L.length} meses acima do total de 2025.`})}

}
/* posições palete */
function insPal(spec,R){

  const occ=(d,locs)=>sum(EST_D.get(d).filter(r=>locs.includes(D.tipos[r.t])&&r.pal!=null),r=>r.pal);
  const kgOf=(d,locs)=>sum(EST_D.get(d).filter(r=>locs.includes(D.tipos[r.t])&&r.pal!=null),r=>r.kg);
  const allLocs=[...new Set(PAL_CAP.flatMap(c=>c.locs))];
  const locs=spec.loc?[spec.loc]:spec.u?PAL_CAP.find(c=>c.u===spec.u).locs:allLocs;
  const cap=spec.u?PAL_CAP.find(c=>c.u===spec.u).cap:spec.cap?sum(PAL_CAP,c=>c.cap):null;
  const last=ds[ds.length-1],first=ds[0];const o=occ(last,locs),o0=occ(first,locs);const out=[];
  const its=[{k:'',t:`${F.n(o)} posições ocupadas em ${dFmt(last)}, com ${F.n(div(kgOf(last,locs),o))} kg por posição.`}];
  if(cap){const oc=div(o,cap);its.push({k:oc>=.9?'crit':oc>=.75?'warn':'good',t:`Ocupação de <b>${F.pct(oc)}</b>: ${F.n(cap-o)} livres de ${F.n(cap)}. ${oc>=.9?'Acima de 90%, pouca folga para receber.':oc>=.75?'Entre 75% e 90%, atenção à folga.':'Folga confortável.'}`})}
  out.push({h:'Situação atual',items:its});
  if(ds.length>1){const L=ds.map(d=>({l:dFmt(d),v:occ(d,locs)}));const e=extremes(L);const dlt=o-o0;
    const t=[{k:dlt>0&&cap?'warn':'',t:`De ${dFmt(first)} a ${dFmt(last)}: ${dlt>=0?'+':'−'}${F.n(Math.abs(dlt))} posições ocupadas (${ds.length} registros).`}];
    if(e)t.push({k:'',t:`Maior ocupação: <b>${e.hi.l}</b> (${F.n(e.hi.v)}); menor: ${e.lo.l} (${F.n(e.lo.v)}).`});
    if(cap&&e)t.push({k:'',t:`No pico, sobravam ${F.n(cap-e.hi.v)} posições livres (${F.pct(div(e.hi.v,cap))} de ocupação).`});
    out.push({h:'Desde o início do registro de paletes',items:t})}
  if(!spec.u&&!spec.loc&&cap){out.push({h:'Por filial',items:PAL_CAP.map(c=>{const x=occ(last,c.locs);const oc=div(x,c.cap);return{k:oc>=.9?'crit':oc>=.75?'warn':'good',t:`<b>CD ${c.u} ${c.nm}</b>: ${F.pct(oc)} ocupado, ${F.n(c.cap-x)} livres.`}})})}
  return out;
}
function insBuild(sp){

/* Efetividade: meses de 2026 (jan–ago mensal; set–out consolidado a partir dos registros diários) */
function efMonths(R){
  const m=new Map();
  EF.forEach(r=>{const mk=r.k.slice(0,7);const inRange=r.g==='m'?(mk>=R[0].slice(0,7)&&mk<=R[1].slice(0,7)):inR(r.k,R);if(!inRange)return;
    const o=m.get(mk)||{k:mk,cam:0,vp:0,vc:0,vk:0,dp:0,dc:0,dk:0,rp:0,rc:0,rk:0,vcOk:0,dcOk:0,bad:0,n:0};
    ['cam','vp','vc','vk','dp','dc','dk','rp','rc','rk'].forEach(f=>o[f]+=r[f]||0);
    if(!r.bad){o.vcOk+=r.vc;o.dcOk+=r.dc}else o.bad++;o.n++;m.set(mk,o)});
  return [...m.values()].sort((a,b)=>a.k.localeCompare(b.k));
}
function efAgg(ms){const s={};['cam','vp','vc','vk','dp','dc','dk','rp','rc','rk','vcOk','dcOk','bad'].forEach(f=>s[f]=sum(ms,r=>r[f]));
  s.ep=1-div(s.dp,s.vp);s.ec=s.vcOk?1-s.dcOk/s.vcOk:null;s.ek=1-div(s.dk,s.vk);return s}
function mEfet(){
  const R=[S.from,S.to];

  B.ep=1-B.dp/B.vp;B.ec=1-B.dc/B.vc;B.ek=1-B.dk/B.vk;
  if(!ms.length){
    h+=`<div class="note"><b>A aba Efetividade só tem detalhe a partir de jan/26.</b> Para 2025 existe apenas o total anual, mostrado abaixo.</div>`;
    h+=`<div class="kpis">${kpi({label:'Efetividade de pedidos 2025',value:F.pct(B.ep,2),hero:true})}${kpi({label:'Efetividade de caixas 2025',value:F.pct(B.ec,2)})}${kpi({label:'Efetividade de KG 2025',value:F.pct(B.ek,2)})}${kpi({label:'Devoluções 2025',value:F.n(B.dp),unit:'pedidos',sub:F.n(B.dk)+' kg'})}${kpi({label:'Reembarques 2025',value:F.n(B.rp),unit:'pedidos',sub:F.n(B.rk)+' kg'})}</div>`;
    return h;
  }
  const a=efAgg(ms);

/* ---------- PDF: todos os módulos, um por página ---------- */
let PDFMODE=false;
function loadScript(urls){return new Promise((res,rej)=>{const tryN=i=>{if(i>=urls.length)return rej(new Error('lib'));const s=document.createElement('script');s.src=urls[i];s.onload=()=>res();s.onerror=()=>{s.remove();tryN(i+1)};document.head.appendChild(s)};tryN(0)})}
async function pdfLibs(){
  if(!window.jspdf)await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js']);
  if(!window.html2canvas)await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js']);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function captureModules(msg){
  const html=document.documentElement;const out=[];let stage=null;
  try{
    await pdfLibs();
    html.classList.add('pdfmode');html.setAttribute('data-theme','light');PDFMODE=true;window.scrollTo(0,0);
    stage=document.createElement('div');stage.id='pdfStage';document.body.appendChild(stage);
    const logo=document.querySelector('.logo-l').src,gen=new Date();
    const genTxt=String(gen.getDate()).padStart(2,'0')+'/'+String(gen.getMonth()+1).padStart(2,'0')+'/'+gen.getFullYear();
    for(let i=0;i<MODS.length;i++){
      const m=MODS[i];msg.textContent=`Preparando a impressão: ${m.name} (${i+1} de ${MODS.length})`;
      charts.forEach(c=>c.destroy());charts=[];queue=[];INS=[];S.mod=m.id;
      PART=new Set();if(gran()==='m'){bucketsFor([S.from,S.to],'m').forEach((k,j)=>{if(isPartial(k))PART.add(j)})}
      stage.innerHTML=`<div class="pdf-h"><img src="${logo}" alt=""><div class="pdf-t"><small>Painel executivo · CDs</small><h1>${m.name}</h1></div><div class="pdf-r">Página ${i+1} de ${MODS.length}<br>Painel atualizado até ${dFmt(LAST)}<br>Gerado em ${genTxt}</div></div><div class="content">${RENDER[m.id]()}</div>`;
      drawQueued();await wait(250);
      const cv=await html2canvas(stage,{scale:1.6,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1300,scrollX:0,scrollY:0});
      out.push({src:cv.toDataURL('image/jpeg',0.9),w:cv.width,h:cv.height});
    }
  }finally{if(stage)stage.remove();html.classList.remove('pdfmode');PDFMODE=false}
  return out;
}
async function genPDF(){
  closeIns();document.getElementById('expMenu').hidden=true;
  const busy=document.getElementById('pdfBusy'),msg=busy.querySelector('span');busy.hidden=false;msg.textContent='Preparando a impressão…';
  const html=document.documentElement,theme=html.getAttribute('data-theme'),keep=S.mod,sy=window.scrollY;
  let pages=null;

    pages.forEach((p,i)=>{let w=PW-2*M,h=p.h*w/p.w;if(h>PH-2*M){h=PH-2*M;w=p.w*h/p.h}if(i)pdf.addPage();pdf.addImage(p.src,'JPEG',(PW-w)/2,M,w,h,undefined,'FAST')});

  }catch(e){const c=e&&e.code;toast(c==='declined'?'Download cancelado.':'Não foi possível abrir a impressão nesta tela.')}

    iB.innerHTML=instHtml();const c=document.getElementById('instCopy');
    if(c)c.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(SITE):Promise.reject()).then(()=>{c.textContent='Link copiado'},()=>{prompt('Copie o link:',SITE)})};
    if(idlg.showModal)idlg.showModal();else idlg.setAttribute('open','');
  };
  ib.onclick=instGo;document.getElementById('instSide').onclick=()=>{if(window.closeSide)closeSide();instGo()};
  if(onSite&&/[?&]salvar=1/.test(location.search)&&!instEvt){setTimeout(()=>{if(!instEvt&&isMob())instGo()},1500)}
  document.getElementById('instX').onclick=()=>idlg.close?idlg.close():idlg.removeAttribute('open');
  idlg.addEventListener('click',e=>{if(e.target===idlg)idlg.close()});
  document.getElementById('pdfBtn').onclick=genPDF;
  document.getElementById('fTog').onclick=()=>{const t=document.querySelector('.topbar');const o=t.classList.toggle('fopen');document.getElementById('fTog').setAttribute('aria-expanded',String(o))};
  document.getElementById('menuBtn').onclick=()=>{side.classList.add('open');scrim.hidden=false};scrim.onclick=closeSide;
  // tabela/gráfico
  document.getElementById('content').addEventListener('click',e=>{const k=e.target.closest('[data-ins]');if(k&&!e.target.closest('[data-tbl],a,button')){openIns(+k.dataset.ins);return}});
  document.getElementById('content').addEventListener('keydown',e=>{const k=e.target.closest&&e.target.closest('[data-ins]');if(k&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openIns(+k.dataset.ins)}});
  document.getElementById('insBg').addEventListener('click',closeIns);document.querySelector('#ins .ins-x').addEventListener('click',closeIns);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIns()});
  document.getElementById('content').addEventListener('change',e=>{if(e.target&&e.target.id==='rvDia'){RV_DIA=e.target.value;render()}});
  document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('[data-tbl]');if(!b)return;const id=b.dataset.tbl;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'Gráfico':'Tabela';document.getElementById(id+'-tbl').hidden=!on;document.getElementById(id+'-box').hidden=on});
  // exportar
  const eb=document.getElementById('expBtn'),em=document.getElementById('expMenu');
  eb.onclick=()=>{em.hidden=!em.hidden;eb.setAttribute('aria-expanded',String(!em.hidden))};
  document.addEventListener('click',e=>{if(!e.target.closest('.actions')){em.hidden=true;eb.setAttribute('aria-expanded','false')}});
  em.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>doExport(b.dataset.exp));
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{downloads=d}).catch(()=>{})}
  if(window.Chart){Chart.defaults.font.family='Public Sans, Segoe UI, system-ui, sans-serif'}
  render();
}
boot();
</script>
